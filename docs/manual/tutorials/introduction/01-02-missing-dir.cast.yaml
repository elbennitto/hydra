name: First Context - Missing Directory
steps:
  - run: echo "$HYDRA_CONTEXT"
    typed: true
  - run: hydra local apps
    typed: true
    expectedExitCode: 1
  - marker: Checked apps with missing directory
  - assert:
      cast: plain(cast).contains("directory does not exist") && plain(cast).contains("HYDRA_CONTEXT")
  - run: hydra message --title 'Expected error' --text 'The "directory does not exist" error is expected here.\nThe target directory has not been created yet.'
    input: false
  - export-to-directory: docs/tutorials/introduction/01-02-missing-dir
