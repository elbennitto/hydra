name: publish
run-name: publish ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: publish
    env:
      HYDRA_SECRETS_REPO: ${{ github.repository }}
    steps:
      - name: Print github.actor
        run: echo "github.actor=${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install cosign
        uses: ./.github/actions/install-cosign

      - name: Install sops
        uses: ./.github/actions/install-sops

      - name: Install goreleaser
        uses: ./.github/actions/install-goreleaser

      - name: Verify release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOPS_AGE_KEY_PUBLISH: ${{ secrets.SOPS_AGE_KEY_PUBLISH }}
        run: ./scripts/publish.sh verify

      - name: Build and publish manual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          HYDRA_MANUAL_PAGES_TARGET_DIR: docs
          HYDRA_MANUAL_PAGES_TARGET_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOPS_AGE_KEY_PUBLISH: ${{ secrets.SOPS_AGE_KEY_PUBLISH }}
        run: ./scripts/publish.sh manual

      - name: Build and publish CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOPS_AGE_KEY_PUBLISH: ${{ secrets.SOPS_AGE_KEY_PUBLISH }}
        run: ./scripts/publish.sh cli

      - name: Update Homebrew source formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOPS_AGE_KEY_PUBLISH: ${{ secrets.SOPS_AGE_KEY_PUBLISH }}
        run: ./scripts/publish.sh formula

      - name: Build and publish container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOPS_AGE_KEY_PUBLISH: ${{ secrets.SOPS_AGE_KEY_PUBLISH }}
        run: ./scripts/publish.sh container
