# Prose linting for Hydra docs (readability-pass experiment).
# Run: ./scripts/lint-prose-docs.sh
# Sync style packages after changing Packages: ./scripts/lint-prose-docs.sh --sync

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Hydra

# Google = technical-doc baseline; write-good = weasel words / passive voice hints.
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good, HydraReadability

# Tutorial pages use title-case headings and the word "chapter" by design.
Google.Headings = NO
Google.WordList = NO

# Technical prose needs "is"/"are"; E-Prime fights that.
write-good.E-Prime = NO

# AsciiCast transcripts and generated metadata are not editorial prose.
[docs/manual/tutorials/**/**.cast.yaml]
BasedOnStyles =

[docs/manual/**/**.cast.yaml]
BasedOnStyles =

[docs/site/**]
BasedOnStyles =

[docs/develop/**]
BasedOnStyles =
