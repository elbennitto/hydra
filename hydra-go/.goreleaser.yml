version: 2

project_name: hydra
dist: ../dist

builds:
  - id: hydra
    dir: cli
    main: .
    binary: hydra
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X hydra-gitops.org/hydra/hydra-go/base/buildinfo.Version={{.Version}} -X hydra-gitops.org/hydra/hydra-go/base/buildinfo.TagSHA={{.FullCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v2

gomod:
  dir: cli

archives:
  - id: hydra
    ids: [hydra]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  - id: hydra-archives-signature
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --key
      - "{{ .Env.COSIGN_PRIVATE_KEY_PATH }}"
      - "--bundle=${signature}"
      - "${artifact}"
  - id: hydra-checksums-signature
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --key
      - "{{ .Env.COSIGN_PRIVATE_KEY_PATH }}"
      - "--bundle=${signature}"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^tmp-"
      - "^Merge"

homebrew_casks:
  - name: hydra-bin
    ids: [hydra]
    commit_author:
      name: "{{ .Env.GIT_AUTHOR_NAME }}"
      email: "{{ .Env.GIT_AUTHOR_EMAIL }}"
      signing:
        enabled: true
        key: "{{ .Env.GIT_SIGNING_KEY_PATH }}"
        format: ssh
    binaries:
      - hydra
    repository:
      owner: "{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}"
      name: "{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }}"
      branch: main
      git:
        url: "ssh://git@github.com/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }}.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: "https://hydra-gitops.org/"
    description: "Hydra GitOps CLI binary for Kubernetes cluster management"
    license: "Apache-2.0"

release:
  footer: |
    ## Install

    Docker (multi-arch `linux/amd64` + `linux/arm64`):

    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/hydra:latest
    ```

    Stable releases also publish `{{ .Tag }}`, `vX.Y`, `vX`, and `latest` aliases.

    Homebrew (macOS recommended, build from source):

    ```bash
    brew tap {{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }} https://github.com/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }}.git
    brew install hydra
    ```

    Homebrew (Linux recommended, install binary cask):

    ```bash
    brew tap {{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }} https://github.com/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_OWNER }}/{{ .Env.HOMEBREW_TAP_DEPLOY_TARGET_NAME }}.git
    brew install --cask hydra-bin
    ```

    Verify downloaded archives with the published checksum file:

    ```bash
    curl -LO https://github.com/{{ .Env.GITHUB_REPOSITORY }}/releases/download/{{ .Tag }}/checksums.txt
    shasum -a 256 --check checksums.txt
    ```
